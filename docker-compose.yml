services:
  sqld:
    image: ${LIBSQL_SERVER_IMAGE:-ghcr.io/tursodatabase/libsql-server:latest}
    command:
      - /bin/sqld
      - --enable-namespaces
      - --admin-listen-addr=0.0.0.0:9090
      - --auth-jwt-key-file=/var/lib/sqld/auth.pem
    environment:
      # The libsql-server entrypoint already materializes these as CLI flags.
      # Do not pass --db-path or --http-listen-addr in command as well.
      SQLD_NODE: primary
      SQLD_DB_PATH: /var/lib/sqld/data
      SQLD_HTTP_LISTEN_ADDR: 0.0.0.0:8080
    expose:
      - '8080'
      - '9090'
    volumes:
      - ${SQLD_DATA_DIR_HOST:-./backend/data/sqld}:/var/lib/sqld
    restart: unless-stopped
    networks:
      coolify:
        aliases:
          - sqld
    depends_on:
      sqld-auth-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/9090' && timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      # Base router is localhost-only. Public namespace routing is enabled by
      # an explicit Coolify domain/override with literal values; do not rely on
      # ${VAR:-default} interpolation inside Traefik labels under Coolify.
      - "traefik.http.routers.sqld.rule=HostRegexp(`{subdomain:[a-z0-9-]+}.localhost`)"
      # Keep the shared wildcard below dedicated runtime/namespace routers.
      - "traefik.http.routers.sqld.priority=10"
      - "traefik.http.services.sqld.loadbalancer.server.port=8080"
      # Exact namespace routing is configured explicitly in Coolify or in an
      # override file with literal values. Do not put `${VAR:-default}` in a
      # Traefik label: Coolify may pass it through literally.

  # Keep the auth bootstrap script inside the image. Bind-mounting it from the
  # repo can fail under Coolify because compose runs from /artifacts inside the
  # helper container while Docker resolves bind-mount paths on the host.
  sqld-auth-init:
    build:
      context: ./backend
      dockerfile: Dockerfile.auth-init
    command:
      - /bin/sh
      - -c
      - node /scripts/init-sqld-auth.mjs /data && (chown -R "$${SQLD_UID:-666}:$${SQLD_GID:-666}" /data 2>/dev/null || true)
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ${SQLD_DATA_DIR_HOST:-./backend/data/sqld}:/data
    restart: 'no'
    networks:
      - coolify

  backend:
    build:
      context: ./backend
    ports:
      - '${BACKEND_PORT_BIND:-5000}:5000'
    environment:
      PORT: '5000'
      DATABASE_FILE: /app/data/control.db
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5001}
      SQLITE_STORAGE_ROOT: /app/data/sqlite
      SQLITE_DISCOVERY_PATH: /app/data/sqlite
      SQLITE_DISCOVERY_ADOPT: ${SQLITE_DISCOVERY_ADOPT:-false}
      DATABASE_PUBLIC_HOST: ${DATABASE_PUBLIC_HOST:-host.docker.internal}
      DATABASE_PUBLIC_PROTOCOL: ${DATABASE_PUBLIC_PROTOCOL:-http}
      DATABASE_PUBLIC_DOMAIN: ${DATABASE_PUBLIC_DOMAIN:-localhost}
      LIBSQL_ENABLE_NAMESPACES: 'true'
      LIBSQL_ADMIN_URL: http://sqld:9090
      LIBSQL_INTERNAL_URL: http://sqld:8080
      SQLD_DATA_DIR: /app/data/sqld
      LIBSQL_AUTH_DIR: /app/data/sqld
      LIBSQL_SERVER_IMAGE: ${LIBSQL_SERVER_IMAGE:-ghcr.io/tursodatabase/libsql-server:latest}
      LIBSQL_PROVISION_ASYNC: 'false'
      # Imports default to local SQLite files. Set to auto/true only when the
      # namespace public DNS/TLS setup is ready.
      LIBSQL_NAMESPACE_IMPORTS: ${LIBSQL_NAMESPACE_IMPORTS:-false}
      LIBSQL_IMPORT_RUNTIME: ${LIBSQL_IMPORT_RUNTIME:-false}
      # libSQL-first policy: new bases/imports must be real libSQL primaries.
      LIBSQL_REQUIRE_PRIMARY: ${LIBSQL_REQUIRE_PRIMARY:-true}
      LIBSQL_ALLOW_LOCAL_FILE: ${LIBSQL_ALLOW_LOCAL_FILE:-false}
      LIBSQL_PRIMARY_MODE: ${LIBSQL_PRIMARY_MODE:-auto}
      LIBSQL_NAMESPACE_PUBLIC_ENABLED: ${LIBSQL_NAMESPACE_PUBLIC_ENABLED:-false}
      LIBSQL_NAMESPACE_HOST: ${LIBSQL_NAMESPACE_HOST:-}
      # "Make public libSQL" conversion: runtime | namespace | auto
      LIBSQL_CONVERSION_MODE: ${LIBSQL_CONVERSION_MODE:-auto}
      # Optional Traefik TLS labels for dynamically created dedicated runtimes.
      # Leave empty if you use the shared sqld namespace router below.
      TRAEFIK_CERT_RESOLVER: ${TRAEFIK_CERT_RESOLVER:-}
      TRAEFIK_ENTRYPOINT: ${TRAEFIK_ENTRYPOINT:-}
      # Docker network shared by the backend, Traefik and runtime containers.
      # Empty = detect from the backend container (prefers "coolify"). The
      # runtime never falls back to the default bridge network.
      LIBSQL_RUNTIME_NETWORK: ${LIBSQL_RUNTIME_NETWORK:-}
      LIBSQL_BACKEND_CONTAINER_ID: ${LIBSQL_BACKEND_CONTAINER_ID:-}
      # Import uploads are staged on the data volume to avoid cross-device
      # copies. The frontend shows progress; large files can use Server path.
      IMPORT_STAGING_DIR: ${IMPORT_STAGING_DIR:-/app/data/tmp}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-524288000}
      DB_CONNECTION_POOL_MAX_SIZE: ${DB_CONNECTION_POOL_MAX_SIZE:-256}
      DB_CONNECTION_POOL_IDLE_TTL_MS: ${DB_CONNECTION_POOL_IDLE_TTL_MS:-1800000}
      SQLITE_READ_POOL_SIZE: ${SQLITE_READ_POOL_SIZE:-4}
      SQLITE_PERFORMANCE_PROFILE: ${SQLITE_PERFORMANCE_PROFILE:-performance}
      SQL_QUERY_TIMEOUT_MS: ${SQL_QUERY_TIMEOUT_MS:-15000}
      QUERY_HARD_MAX_ROWS: ${QUERY_HARD_MAX_ROWS:-1000}
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-true}
      ANALYTICS_RAW_RETENTION_DAYS: ${ANALYTICS_RAW_RETENTION_DAYS:-14}
      ANALYTICS_FLUSH_INTERVAL_MS: ${ANALYTICS_FLUSH_INTERVAL_MS:-1000}
      ANALYTICS_MAX_QUEUE: ${ANALYTICS_MAX_QUEUE:-10000}
      ANALYTICS_STORAGE_SAMPLE_MINUTES: ${ANALYTICS_STORAGE_SAMPLE_MINUTES:-60}
      ANALYTICS_STORAGE_RETENTION_DAYS: ${ANALYTICS_STORAGE_RETENTION_DAYS:-90}
      ANALYTICS_TRAFFIC_ENABLED: ${ANALYTICS_TRAFFIC_ENABLED:-true}
      SNAPSHOTS_ENABLED: ${SNAPSHOTS_ENABLED:-true}
      SNAPSHOT_LIBSQL_ENABLED: ${SNAPSHOT_LIBSQL_ENABLED:-true}
      SNAPSHOT_LIBSQL_VERIFY_REPLAY: ${SNAPSHOT_LIBSQL_VERIFY_REPLAY:-true}
      SNAPSHOT_LIBSQL_ARTIFACT: ${SNAPSHOT_LIBSQL_ARTIFACT:-auto}
      SNAPSHOT_LIBSQL_MAX_BYTES: ${SNAPSHOT_LIBSQL_MAX_BYTES:-10737418240}
      SNAPSHOT_LIBSQL_DUMP_TIMEOUT_MS: ${SNAPSHOT_LIBSQL_DUMP_TIMEOUT_MS:-900000}
      SCHEMA_CACHE_TTL_MS: ${SCHEMA_CACHE_TTL_MS:-60000}
      SCHEMA_CACHE_MAX_ENTRIES: ${SCHEMA_CACHE_MAX_ENTRIES:-200}
      METRICS_CACHE_TTL_MS: ${METRICS_CACHE_TTL_MS:-5000}
      RUNTIME_HEALTH_INTERVAL_MINUTES: ${RUNTIME_HEALTH_INTERVAL_MINUTES:-10}
      RUNTIME_HEALTH_PUBLIC_TIMEOUT_MS: ${RUNTIME_HEALTH_PUBLIC_TIMEOUT_MS:-5000}
      RUNTIME_HEALTH_STARTUP_DELAY_SECONDS: ${RUNTIME_HEALTH_STARTUP_DELAY_SECONDS:-20}
      RUNTIME_HEALTH_CONCURRENCY: ${RUNTIME_HEALTH_CONCURRENCY:-4}
      SNAPSHOT_INTERVAL_MINUTES: ${SNAPSHOT_INTERVAL_MINUTES:-60}
      SNAPSHOT_FULL_WINDOW_HOURS: ${SNAPSHOT_FULL_WINDOW_HOURS:-24}
      SNAPSHOT_SIX_HOURLY_WINDOW_HOURS: ${SNAPSHOT_SIX_HOURLY_WINDOW_HOURS:-72}
      SNAPSHOT_RETENTION_DAYS: ${SNAPSHOT_RETENTION_DAYS:-14}
      SNAPSHOT_SCHEDULER_TICK_MINUTES: ${SNAPSHOT_SCHEDULER_TICK_MINUTES:-5}
      SNAPSHOT_TIMEZONE: ${SNAPSHOT_TIMEZONE:-UTC}
      SNAPSHOT_MAX_CONCURRENT: ${SNAPSHOT_MAX_CONCURRENT:-1}
      SNAPSHOT_MIN_FREE_BYTES: ${SNAPSHOT_MIN_FREE_BYTES:-1073741824}
      SNAPSHOT_STALE_MINUTES: ${SNAPSHOT_STALE_MINUTES:-30}
      SNAPSHOT_VERIFY_ON_RESTORE: ${SNAPSHOT_VERIFY_ON_RESTORE:-true}
      SNAPSHOT_STORAGE_ROOT: ${SNAPSHOT_STORAGE_ROOT:-/app/data/sqlite/snapshots}
      # Optional policy gateway for direct libSQL clients. Leave disabled until
      # the gateway service has a strong token and the /gateway route is
      # published through Traefik.
      DATABASE_GATEWAY_ENABLED: ${DATABASE_GATEWAY_ENABLED:-false}
      DATABASE_GATEWAY_PATH: ${DATABASE_GATEWAY_PATH:-/gateway/}
      DATABASE_GATEWAY_ROOT_HOST: ${DATABASE_GATEWAY_ROOT_HOST:-}
      GATEWAY_ALLOW_ROOT: ${GATEWAY_ALLOW_ROOT:-false}
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:-}
      GATEWAY_BACKEND_INTERNAL_URL: ${GATEWAY_BACKEND_INTERNAL_URL:-http://backend:5000}
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ${BACKEND_DATA_DIR_HOST:-./backend/data}:/app/data
      - ${SQLD_DATA_DIR_HOST:-./backend/data/sqld}:/app/data/sqld
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      sqld:
        condition: service_started
    restart: unless-stopped
    networks:
      - coolify
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5000/api/v1/health 2>/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  # Policy gateway for direct libSQL clients. It is path-based so it can reuse
  # the existing wildcard DNS/TLS for database hosts: clients use the normal
  # database host followed by /gateway/ instead of the direct root URL.
  #
  # This service is only useful when DATABASE_GATEWAY_ENABLED=true and the
  # backend and gateway share a non-empty GATEWAY_INTERNAL_TOKEN.
  gateway:
    build:
      context: ./backend
    command: ["node", "dist/gateway/main.js"]
    environment:
      GATEWAY_PORT: '8081'
      GATEWAY_POLICY_URL: ${GATEWAY_POLICY_URL:-http://backend:5000/api/v1/internal/gateway/policy}
      GATEWAY_BACKEND_INTERNAL_URL: ${GATEWAY_BACKEND_INTERNAL_URL:-http://backend:5000}
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:-}
      GATEWAY_PATH_PREFIX: ${DATABASE_GATEWAY_PATH:-/gateway}
      GATEWAY_ALLOW_ROOT: ${GATEWAY_ALLOW_ROOT:-false}
      GATEWAY_BODY_LIMIT_BYTES: ${GATEWAY_BODY_LIMIT_BYTES:-33554432}
      GATEWAY_POLICY_TTL_MS: ${GATEWAY_POLICY_TTL_MS:-1000}
      GATEWAY_POLICY_MAX_STALE_MS: ${GATEWAY_POLICY_MAX_STALE_MS:-5000}
      GATEWAY_UPSTREAM_TIMEOUT_MS: ${GATEWAY_UPSTREAM_TIMEOUT_MS:-120000}
      GATEWAY_ANALYTICS_ENABLED: ${GATEWAY_ANALYTICS_ENABLED:-true}
      GATEWAY_ANALYTICS_FLUSH_MS: ${GATEWAY_ANALYTICS_FLUSH_MS:-1000}
      GATEWAY_ANALYTICS_MAX_QUEUE: ${GATEWAY_ANALYTICS_MAX_QUEUE:-5000}
      GATEWAY_ANALYTICS_BATCH_SIZE: ${GATEWAY_ANALYTICS_BATCH_SIZE:-500}
      GATEWAY_ANALYTICS_TIMEOUT_MS: ${GATEWAY_ANALYTICS_TIMEOUT_MS:-5000}
      GATEWAY_LOG_REQUESTS: ${GATEWAY_LOG_REQUESTS:-false}
    expose:
      - '8081'
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - coolify
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8081/__health 2>/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      # Path-based router: same DB host, /gateway/ prefix. If the gateway is
      # down, the runtime's root route does not match /gateway/v2/pipeline, so
      # traffic fails closed instead of falling back to direct access.
      - "traefik.http.routers.libsqlite-gateway.rule=PathPrefix(`/gateway`)"
      - "traefik.http.routers.libsqlite-gateway.priority=2000"
      - "traefik.http.routers.libsqlite-gateway.tls=true"
      - "traefik.http.services.libsqlite-gateway.loadbalancer.server.port=8081"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
    ports:
      - '${FRONTEND_PORT_BIND:-5001}:5001'
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:5000/api/v1}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - coolify

networks:
  coolify:
    external: true
